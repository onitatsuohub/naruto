<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Naruto Online - Login + Servidores</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif;text-align:center}
h1{color:#ff9900;margin:20px 0 10px}
p{color:#aaa}
.btn{display:block;width:90%;max-width:400px;margin:15px auto;padding:18px;background:#ff9900;color:#000;font-weight:bold;font-size:18px;border:0;border-radius:10px;text-decoration:none}
.btn2{background:#222;color:#fff;border:1px solid #444}
#log{margin-top:20px;font-size:12px;color:#666}
</style>
</head>
<body>
<h1>NARUTO ONLINE</h1>
<p>Sin Flash - Con Ruffle - Entra con tu cuenta Bazinger</p>

<a class="btn" href="https://naruto.narutowebgame.com/es/">1. LOGIN DE CUENTA</a>
<a class="btn" href="https://naruto.narutowebgame.com/es/serverlist/">2. LISTA DE SERVIDORES</a>
<a class="btn btn2" href="https://naruto.narutowebgame.com/es/serverlist/s3">3. ENTRAR DIRECTO S3 SAKURA</a>

<p id="log">Ruffle cargado: <span id="status">cargando...</span></p>

<script>
window.RufflePlayer = window.RufflePlayer || {};
window.addEventListener("load", () => {
    const ruffle = window.RufflePlayer.newest();
    document.getElementById("status").innerText = "OK - Ya podes logearte";
    // Ruffle emula automáticamente cualquier SWF que cargue la pagina oficial
    // No hace falta iframe
});

// Si venis de Github Pages, redirige con Ruffle ya activo
if (window.location.search.includes("auto=s3")) {
    window.location.href = "https://naruto.narutowebgame.com/es/serverlist/s3";
}
</script>
</body>
</html>
